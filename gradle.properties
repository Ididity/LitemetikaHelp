# ---------------------------------------------------------------------------
# Litematica Extras – Build-Einstellungen
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft-Version (fest)
minecraft_version=1.21.11

# "auto" = beim ersten Build automatisch die neueste passende Version holen
# und in versions.lock.properties festschreiben. Datei löschen = neu auflösen.
# Du kannst hier auch feste Versionen eintragen, z. B. loader_version=0.18.4
loader_version=auto
yarn_mappings=auto
fabric_api_version=auto
# Litematica / Malilib von Modrinth (Version-ID oder Versionsnummer).
# Alternativ: die beiden .jar-Dateien aus deinem mods-Ordner in den Ordner "libs/" legen,
# dann werden diese benutzt und diese beiden Zeilen ignoriert.
litematica_version=auto
malilib_version=auto

# UNSICHER: Loom-Version. Falls der Build mit "Plugin not found" scheitert,
# hier eine andere Version eintragen (siehe https://fabricmc.net/develop).
loom_version=1.17-SNAPSHOT

# Mod
mod_version=1.7
maven_group=dev.litextras
archives_base_name=litematica-extras
