{"name": "Mod bauen",
"on": {"push": null, "workflow_dispatch": null},
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"name": "Projekt zusammensetzen", "run": "ls -la; (unzip -tq Mod-Dateien.zip >/dev/null 2>&1 && unzip -o -q Mod-Dateien.zip -d .) || true; for p in src/main/java/dev/litextras/LitematicaExtras.java src/main/java/dev/litextras/ai/AiService.java src/main/java/dev/litextras/ai/AiTypes.java src/main/java/dev/litextras/ai/AnthropicProvider.java src/main/java/dev/litextras/ai/BuiltinTools.java src/main/java/dev/litextras/ai/GeminiProvider.java src/main/java/dev/litextras/ai/Http.java src/main/java/dev/litextras/ai/OpenAiProvider.java src/main/java/dev/litextras/ai/Privacy.java src/main/java/dev/litextras/ai/ReadOnlyTool.java src/main/java/dev/litextras/ai/ToolContext.java src/main/java/dev/litextras/ai/ToolRegistry.java src/main/java/dev/litextras/command/Actions.java src/main/java/dev/litextras/command/CommandRegistry.java src/main/java/dev/litextras/config/Cfg.java src/main/java/dev/litextras/config/Colors.java src/main/java/dev/litextras/config/ConfigManager.java src/main/java/dev/litextras/config/ConfigSpec.java src/main/java/dev/litextras/config/Json5.java src/main/java/dev/litextras/core/BlockComparator.java src/main/java/dev/litextras/core/CompareResult.java src/main/java/dev/litextras/core/EquivalenceGroups.java src/main/java/dev/litextras/core/ErrorScanner.java src/main/java/dev/litextras/core/InventoryIndex.java src/main/java/dev/litextras/core/ItemMapping.java src/main/java/dev/litextras/core/LitematicaBridge.java src/main/java/dev/litextras/core/LookTarget.java src/main/java/dev/litextras/gui/ConfigScreen.java src/main/java/dev/litextras/hud/Describe.java src/main/java/dev/litextras/hud/HudPanel.java src/main/java/dev/litextras/hud/HudRenderer.java src/main/java/dev/litextras/mixin/WorldBlockChangeMixin.java src/main/java/dev/litextras/mixin/compat/CompatMixinPlugin.java src/main/java/dev/litextras/mixin/compat/LitematicaOverlayTypeMixin.java src/main/java/dev/litextras/mixin/compat/OverlayTypes.java src/main/java/dev/litextras/render/SeeThroughRenderer.java src/main/java/dev/litextras/util/ChatOut.java src/main/java/dev/litextras/util/Hotkeys.java src/main/java/dev/litextras/util/Lang.java src/main/java/dev/litextras/util/Template.java src/main/resources/assets/litematica_extras/default_system_prompt.txt src/main/resources/assets/litematica_extras/lang_mod/de.json src/main/resources/assets/litematica_extras/lang_mod/en.json src/main/resources/fabric.mod.json src/main/resources/litematica_extras.compat.mixins.json src/main/resources/litematica_extras.mixins.json ; do b=$(basename $p); if [ ! -f $p ] && [ -f $b ]; then mkdir -p $(dirname $p); cp $b $p; fi; done; find src -type f | wc -l; ls src/main/resources/fabric.mod.json"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "21"}},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "9.5.1"}},
{"name": "Bauen", "run": "gradle build --stacktrace"},
{"name": "Pruefen", "run": "unzip -l build/libs/litematica-extras-1.0.0.jar | grep fabric.mod.json"},
{"name": "Hochladen", "uses": "actions/upload-artifact@v4", "with": {"name": "litematica-extras-jar", "path": "build/libs/litematica-extras-1.0.0.jar"}}
]}}}
