name: Mod bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Bauen
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Fertige Mod-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: litematica-extras-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Aufgelöste Versionen hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versions-lock
          path: versions.lock.properties
          if-no-files-found: ignore
