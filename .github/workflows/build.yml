name: Mod bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Bauen
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log

      - name: Klassen untersuchen (Fehlersuche)
        if: always()
        run: |
          {
          echo "===== JARS"
          find ~/.gradle/caches .gradle -name "*.jar" 2>/dev/null | grep -iE "litematica|malilib" | grep -v sources
          for j in $(find ~/.gradle/caches .gradle -name "*.jar" 2>/dev/null | grep -iE "litematica|malilib" | grep -v sources | grep -iE "remapped|named|mapped" ); do
            echo "===== $j"
            unzip -l "$j" | grep -iE "LayerRange|LayerMode|SchematicWorldHandler|DataManager\.class|SchematicPlacementManager\.class|SchematicPlacement\.class|SubRegionPlacement|selection/Box|ChunkRendererSchematicVbo|OverlayType" | awk '{print $4}'
          done
          J=$(find ~/.gradle/caches .gradle -name "*.jar" 2>/dev/null | grep -iE "litematica" | grep -v sources | grep -iE "remapped|named|mapped" | head -1)
          M=$(find ~/.gradle/caches .gradle -name "*.jar" 2>/dev/null | grep -iE "malilib" | grep -v sources | grep -iE "remapped|named|mapped" | head -1)
          for c in $( (unzip -l "$J"; unzip -l "$M") | awk '{print $4}' | grep -E "(LayerRange|LayerMode|DataManager|SchematicWorldHandler|SchematicPlacementManager|placement/SchematicPlacement|ChunkRendererSchematicVbo)\.class$"); do
            echo "===== javap $c"
            javap -cp "$J:$M" "$(echo $c | sed 's/\.class$//; s#/#.#g')" 2>&1 | grep -E "public|enum|class" | head -60
          done
          for c in fi.dy.masa.litematica.schematic.LitematicaSchematic fi.dy.masa.litematica.schematic.container.LitematicaBlockStateContainer fi.dy.masa.litematica.schematic.placement.SchematicPlacement fi.dy.masa.litematica.schematic.placement.SubRegionPlacement fi.dy.masa.litematica.materials.MaterialListBase fi.dy.masa.litematica.data.SchematicHolder; do
            echo "===== FULL $c"
            javap -cp "$J:$M" "$c" 2>&1 | head -120
          done
          echo "===== container classes"
          unzip -l "$J" | awk '{print $4}' | grep -iE "container/|SchematicHolder|schematic/[A-Za-z]+\.class" | head -40
          } > classes.txt 2>&1 || true

      - name: Prüfen, ob die Mod-Datei vollständig ist
        run: unzip -l $(ls build/libs/*.jar | grep -v sources) | grep -E "fabric.mod.json|LitematicaExtras.class|icon.png"

      - name: Fertige Mod-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: litematica-extras-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Bau-Protokoll speichern (für Fehlersuche)
        if: always()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "kein Log" > /tmp/log/build.log
          cp versions.lock.properties /tmp/log/ 2>/dev/null || true
          cp classes.txt /tmp/log/ 2>/dev/null || true
          cp $(ls build/libs/*.jar | grep -v sources) /tmp/log/ 2>/dev/null || true
          cd /tmp/log
          git init -q && git checkout -q -b build-log
          git config user.name "build-bot" && git config user.email "build-bot@users.noreply.github.com"
          echo "${{ job.status }} ${{ github.sha }}" > status.txt
          git add -A && git commit -qm "Bau-Protokoll ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
