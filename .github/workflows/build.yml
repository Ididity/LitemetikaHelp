name: Mod bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Projekt auspacken
        run: |
          if [ -f Mod-Dateien.zip ]; then unzip -o -q Mod-Dateien.zip -d . ; fi
          ls src/main/resources/fabric.mod.json

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Bauen
        run: gradle build --stacktrace

      - name: Prüfen, ob die Mod-Datei vollständig ist
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          unzip -l "$JAR" | grep -E "fabric.mod.json|LitematicaExtras.class"

      - name: Fertige Mod-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: litematica-extras-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Aufgelöste Versionen hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versions-lock
          path: versions.lock.properties
          if-no-files-found: ignore
